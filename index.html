<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Flower 🌸</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      text-align: center;
      background: linear-gradient(135deg, #ffe6f2, #e6f7ff);
      color: #333;
    }

    .container {
      padding: 60px 20px;
    }

    h1 {
      color: #e91e63;
      font-size: 45px;
    }

    .flower {
      font-size: 120px;
      margin: 30px;
      animation: float 2s infinite ease-in-out;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-15px);
      }
    }

    button {
      padding: 14px 25px;
      font-size: 18px;
      border: none;
      border-radius: 25px;
      background: #e91e63;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #c2185b;
    }

    #message {
      margin-top: 25px;
      font-size: 20px;
      color: #555;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>🌸 AI Flower 🌸</h1>

    <div class="flower">🌺</div>

    <p>Welcome to my AI Flower Garden!</p>

    <button onclick="generateFlower()">Generate Flower</button>

    <div id="message"></div>
  </div>

  <script>
    function generateFlower() {
      const flowers = [
        "🌹 Rose — Love and beauty",
        "🌻 Sunflower — Happiness and positivity",
        "🌷 Tulip — Perfect love",
        "🌸 Cherry Blossom — Peace and renewal",
        "🌺 Hibiscus — Beauty and friendship"
      ];

      const randomFlower =
        flowers[Math.floor(Math.random() * flowers.length)];

      document.getElementById("message").innerText = randomFlower;
    }
  </script>

</body>
</html>
